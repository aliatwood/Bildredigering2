    <main>
       <h1>Välkommen till min Bildredigeringsuppgift</h1>
       <p>Jag har redigerat tre bilder med olika tekniker. Redigeringsprogrammet jag använt mig utav är Gimp.</p> 
       
       <section class="image-grid">
        <h2>Mina bildredigeringar</h2>
        <picture>
            <source srcset="bilder/bilserie001-redigerad.avif" type="image/avif">
            <source srcset="bilder/bilserie001-redigerad.webp" type="image/webp">
            <img src="bilder/bilserie001-redigerad.jpg" alt="Första redigerade bilden" loading="lazy">
        </picture>
        <picture>
            <source srcset="bilder/bilserie002-redigerad.avif" type="image/avif">
            <source srcset="bilder/bilserie002-redigerad.webp" type="image/webp">
            <img src="bilder/bilserie002-redigerad.jpg" alt="Andra redigerade bilden" loading="lazy">
        </picture>
        <picture>
            <source srcset="bilder/bilserie008-redigerad.avif" type="image/avif">
            <source srcset="bilder/bilserie008-redigerad.webp" type="image/webp">
            <img src="bilder/bilserie008-redigerad.jpg" alt="Tredje redigerade bilden" loading="lazy">
        </picture>
       </section>
    </main>
